name: Contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Fetch forge-std (test helpers only)
        run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv
